name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - container: debian:sid
            distro: debian-sid
            deps_pkg: libfprint-2-dev
          - container: ubuntu:noble
            distro: ubuntu-24.04
            deps_pkg: libfprint-2-dev
          - container: ubuntu:jammy
            distro: ubuntu-22.04
            deps_pkg: libfprint-2-dev
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y \
            meson ninja-build pkg-config \
            ${{ matrix.deps_pkg }} libglib2.0-dev libgusb-dev \
            libnss3-dev libssl-dev libcairo2-dev \
            gobject-introspection libgirepository1.0-dev \
            libopencv-dev gtk-doc-tools

      - name: Build
        run: |
          cd libfprint
          meson setup builddir --prefix=/usr -Ddrivers=goodixtls55x4 -Dudev_rules=disabled -Ddoc=false
          ninja -C builddir

      - name: Package .deb
        run: |
          cd libfprint
          apt install -y dpkg-dev
          DESTDIR=$(pwd)/debian-pkg
          meson install -C builddir --destdir="$DESTDIR"
          cd "$DESTDIR"
          mkdir -p DEBIAN
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cat > DEBIAN/control << EOF
          Package: goodix-gf32xx-driver
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Goodix Fingerprint Linux Community
          Description: Goodix GF32xx fingerprint sensor driver for Linux
           Modified goodixtls driver supporting GF3208/GF3268 sensors
           (USB 27c6:55a4, 27c6:55b4). Built for ${{ matrix.distro }}.
          Conflicts: libfprint-2-2
          Replaces: libfprint-2-2
          EOF
          dpkg-shlibdeps -O $(find usr -name "*.so*" -type f)
          dpkg-gencontrol
          dpkg-deb --build --root-owner-group . goodix-gf32xx-driver_${VERSION}_${{ matrix.distro }}_amd64.deb
          sha256sum *.deb > SHA256SUMS
          mv *.deb SHA256SUMS "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: goodix-gf32xx-driver_*.deb

  release:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: pkgs
          merge-multiple: true

      - name: Debug artifacts
        run: |
          find pkgs -type f -ls
          echo "---"
          ls -la pkgs/ 2>/dev/null || echo "pkgs/ empty or missing"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkgs/*.deb
            pkgs/SHA256SUMS
          draft: false
          generate_release_notes: true
