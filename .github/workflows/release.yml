name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            distro: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build pkg-config \
            libfprint-2-dev libglib2.0-dev libgusb-dev \
            libnss3-dev libssl-dev libcairo2-dev \
            gobject-introspection libgirepository1.0-dev \
            libopencv-dev gtk-doc-tools

      - name: Build
        run: |
          cd libfprint
          meson setup builddir --prefix=/usr -Ddrivers=goodixtls55x4 -Dudev_rules=disabled -Ddoc=false
          ninja -C builddir

      - name: Package .deb
        run: |
          cd libfprint
          DESTDIR=$(pwd)/debian-pkg
          meson install -C builddir --destdir="$DESTDIR"
          cd "$DESTDIR"
          mkdir -p DEBIAN
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          cat > DEBIAN/control << EOF
          Package: goodix-gf32xx-driver
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Goodix Fingerprint Linux Community
          Description: Goodix GF32xx fingerprint sensor driver for Linux (Ubuntu)
           Modified goodixtls driver for GF3208/GF3268 (USB 27c6:55a4/55b4).
           Built on Ubuntu 24.04. For Debian or other distros, use source build.
          Conflicts: libfprint-2-2
          Replaces: libfprint-2-2
          Provides: libfprint-2-2
          EOF
          dpkg-deb --build --root-owner-group . goodix-gf32xx-driver_${VERSION}_${{ matrix.distro }}_amd64.deb
          sha256sum *.deb > SHA256SUMS
          mv *.deb SHA256SUMS "$GITHUB_WORKSPACE/"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: goodix-gf32xx-driver_*.deb

  release:
    needs: build-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: pkgs
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pkgs/*.deb
            pkgs/SHA256SUMS
          draft: false
          generate_release_notes: true
